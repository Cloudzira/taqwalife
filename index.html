.note{border-left:3px solid var(--gold);padding:4px 0 4px 12px;margin:10px 0}

.del{color:var(--bad);font-size:12px;font-weight:700}
.bdg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}

.bdg span{display:block;font-size:24px}
.doa .ar{font-size:25px;line-height:1.9;text-align:right;direction:rtl;color:var(--gold)}
.comp{width:190px;height:190px;border-radius:50%;margin:12px auto;border:2px solid var(--gold);display:grid;place-items:center;position:relative}
.comp i{position:absolute;width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:80px solid var(--gold);top:10px;left:calc(50% - 11px);transform-origin:50% 85px}
.comp b{font-size:12px;color:var(--mut)}
label.l{display:block;font-weight:600;font-size:13px;margin:10px 0 4px}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:var(--gold);color:#111;padding:10px 18px;border-radius:99px;font-weight:700;font-size:13px;opacity:0;transition:.3s;z-index:150;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.lg{width:30px;height:30px;flex:none}
.lb{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.lb:last-child{border:0}
.lb .rk{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--bg);color:var(--gold);flex:none}
.lb.me .rk,.lb:first-child .rk{background:var(--gg);color:#111}
.code{font-family:'Cormorant Garamond',serif;font-size:38px;letter-spacing:8px;color:var(--gold);line-height:1.2}
.box>svg{display:block;margin-bottom:6px}
.pc{color:var(--gold);border-color:var(--gold);cursor:pointer;background:none}
.hm{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* Jadwal sholat dihitung di perangkat: tanpa API, tanpa batas kuota, jalan offline. Metode Kemenag (Subuh 20°, Isya 18°, Ashar mazhab Syafii, ihtiyath +2 menit) */
function calcPT(date,lat,lon,tz){
  const R=Math.PI/180,sin=x=>Math.sin(x*R),cos=x=>Math.cos(x*R),tan=x=>Math.tan(x*R),asin=x=>Math.asin(x)/R,acos=x=>Math.acos(x)/R,atan2=(y,x)=>Math.atan2(y,x)/R,acot=x=>Math.atan(1/x)/R,fx=(a,b)=>a-b*Math.floor(a/b);
  let Y=date.getFullYear(),M=date.getMonth()+1;const d=date.getDate();if(M<=2){Y--;M+=12}const A=Math.floor(Y/100),B=2-A+Math.floor(A/4);
  const jd=Math.floor(365.25*(Y+4716))+Math.floor(30.6001*(M+1))+d+B-1524.5-lon/360;
  const sp=t=>{const Dd=jd+t-2451545,g=fx(357.529+0.98560028*Dd,360),q=fx(280.459+0.98564736*Dd,360),L=fx(q+1.915*sin(g)+0.020*sin(2*g),360),e=23.439-0.00000036*Dd,RA=fx(atan2(cos(e)*sin(L),cos(L))/15,24);return{dec:asin(sin(e)*sin(L)),eqt:q/15-RA}};
  const mid=t=>fx(12-sp(t).eqt,24);
  const at=(a,t,ccw)=>{const dec=sp(t).dec,v=acos((-sin(a)-sin(dec)*sin(lat))/(cos(dec)*cos(lat)))/15;return mid(t)+(ccw?-v:v)};
  const asr=t=>at(-acot(1+tan(Math.abs(lat-sp(t).dec))),t,false);
  const f=h=>{const m=Math.round(fx(h+tz-lon/15,24)*60+2)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
  return[at(20,5/24,true),mid(.5),asr(13/24),at(.833,18/24,false),at(18,18/24,false)].map(f);
}
function loadPT(){
  const k=key(new Date())+D.city;if(D.pt&&D.pt.k===k)return;
  const[la,lo,tz]=locOf(),t=calcPT(new Date(),la,lo,tz);
  D.pt={k,t:[['Subuh',t[0]],['Dzuhur',t[1]],['Ashar',t[2]],['Maghrib',t[3]],['Isya',t[4]]]};
  lss('taqwalife_v1_'+uid,JSON.stringify(D));if(tab==='home'&&$('#app').style.display==='block')render();
}
function nxi(){
  if(!D.pt)return'';const n=new Date(),m=n.getHours()*60+n.getMinutes();let r=null;
  for(const[k,v]of D.pt.t){const[h,mm]=v.split(':'),x=+h*60+ +mm;if(x>m){r=[k,x-m];break}}
  if(!r){const[h,mm]=D.pt.t[0][1].split(':');r=[D.pt.t[0][0],1440-m+ +h*60+ +mm]}
  return`<p style="margin-bottom:10px;color:var(--mut)">${r[0]} dalam <b style="color:var(--gold)">${r[1]>=60?Math.floor(r[1]/60)+' jam ':''}${r[1]%60} menit</b></p>`;
}

let gDoc=null,gAt=0,gBusy=0,gPend={},gTm=null;
const MAXM=30,FV=()=>firebase.firestore.FieldValue;
const gref=()=>db.collection('groups').doc(D.group.code);
const weekPts=()=>{let s=0;for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);const x=D.days[key(d)];if(x)s+=ALL.reduce((a,y)=>a+(x[y[0]]?y[2]:0),0)}return s};
function pubStats(){
  if(!db||uid==='local'||!D.group)return;
  gref().update({['members.'+uid]:{n:D.name,w:weekPts(),s:streak(),t:points(),ts:Date.now()}}).catch(()=>{});
}
function famListen(){gDoc=null;gAt=0}
async function famLoad(force){
  if(!db||uid==='local'||!D.group||gBusy)return;
  if(force&&Date.now()-gAt<30000)return toast('Baru saja diperbarui');
  if(!force&&gDoc&&Date.now()-gAt<10*60000)return;

  try{const s=await gref().get();if(!s.exists){D.group=null;save();gDoc=null}else{gDoc=s.data();gAt=Date.now()}}catch(e){toast('Gagal memuat grup')}

function famV(){
  if(!db||uid==='local')return`<div class="card"><h3>Keluarga</h3><p style="color:var(--mut)">Fitur ini butuh login Firebase. Masuk dengan akun Anda untuk membuat atau bergabung ke grup keluarga.</p></div>`;

  <div class="card"><h3>Target bersama</h3><input id="gt" placeholder="Misal: Khatam Al-Qur'an keluarga"><div class="flex" style="margin-top:8px"><input id="gg" type="number" min="1" placeholder="Jumlah"><input id="gu" placeholder="Satuan (juz)"></div><button class="btn sm" style="margin-top:10px" onclick="gAddT()">Tambah target</button></div>
  ${T.map(t=>{const p=Math.min(100,Math.round(t.c/t.g*100));return`<div class="card"><div class="flex sp"><b>${esc(t.t)}</b><button class="del" onclick="gDelT('${t.id}')">Hapus</button></div><div class="bar"><i style="width:${p}%"></i></div><div class="flex sp"><small style="color:var(--mut)">${t.c} / ${t.g} ${esc(t.u)} · ${p}%</small><div class="flex"><button class="icb" onclick="gAdj('${t.id}',-1)">−</button><button class="icb" onclick="gAdj('${t.id}',1)">+</button></div></div></div>`}).join('')}
  <button class="btn o" onclick="gLeave()">Keluar dari grup</button>`}
async function gCreate(){
  const n=$('#gn').value.trim();if(!n)return toast('Isi nama grup');
  const code=Array.from(crypto.getRandomValues(new Uint8Array(6)),b=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b%32]).join('');
  try{await db.collection('groups').doc(code).set({name:n,owner:uid,created:Date.now(),members:{},targets:{}});D.group={code,name:n};save();famListen();pubStats();render();toast('Grup dibuat')}catch(e){toast('Gagal membuat grup. Periksa aturan Firestore')}
}
async function gJoin(){
  const c=$('#gc').value.trim().toUpperCase();if(c.length<6)return toast('Kode harus 6 karakter');
  try{const s=await db.collection('groups').doc(c).get();if(!s.exists)return toast('Kode grup tidak ditemukan');
    const m=s.data().members||{};if(Object.keys(m).length>=MAXM&&!m[uid])return toast('Grup penuh (maks '+MAXM+' anggota)');
    D.group={code:c,name:s.data().name};save();famListen();pubStats();render();toast('Berhasil bergabung')}catch(e){toast('Gagal bergabung. Periksa aturan Firestore')}
}
function gLeave(){if(!confirm('Keluar dari grup ini?'))return;gref().update({['members.'+uid]:FV().delete()}).catch(()=>{});D.group=null;save();famListen();render()}
function gAddT(){
  const t=$('#gt').value.trim(),g=+$('#gg').value,u=$('#gu').value.trim()||'kali';if(!t||g<1)return toast('Isi nama dan jumlah target');
  const id='t'+Date.now().toString(36),o={t,g,u,c:0,by:D.name};
  if(gDoc){(gDoc.targets=gDoc.targets||{})[id]=o}render();
  gref().update({['targets.'+id]:o}).catch(()=>toast('Gagal menambah target'));
}
function gAdj(id,n){
  const t=gDoc&&gDoc.targets&&gDoc.targets[id];if(!t)return;n=Math.max(-t.c,n);if(!n)return;
  t.c+=n;gPend[id]=(gPend[id]||0)+n;render();clearTimeout(gTm);
  gTm=setTimeout(()=>{const u={};for(const k in gPend)if(gPend[k])u['targets.'+k+'.c']=FV().increment(gPend[k]);gPend={};if(Object.keys(u).length)gref().update(u).catch(()=>{})},1500);
}
function gDelT(id){if(!confirm('Hapus target bersama ini?'))return;if(gDoc&&gDoc.targets)delete gDoc.targets[id];render();gref().update({['targets.'+id]:FV().delete()}).catch(()=>{})}
