<!-- Definisi ikon api (dipakai sebagai logo lewat <use href="#fl">) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--f1)"/><stop offset=".5" style="stop-color:var(--f2)"/><stop offset="1" style="stop-color:var(--f3)"/></linearGradient></defs><symbol id="fl" viewBox="0 0 100 100"><path d="M50 4C54 20 74 30 74 55C74 74 63 90 50 94C37 90 26 74 26 55C26 44 31 36 37 30C38 38 42 42 46 42C44 30 46 16 50 4Z" fill="url(#fg)"/><path d="M50 58C57 67 61 73 61 79C61 86 56 90 50 90C44 90 39 86 39 79C39 73 43 67 50 58Z" fill="#14100A"/></symbol></svg>
<!-- Splash screen -->
<div id="splash">

  <h1>Taqwa<span class="lt">Life</span></h1><p>Rencanakan, catat, dan evaluasi ibadah harian</p>
</div>

<!-- Halaman login/daftar (isinya dibuat oleh js/auth.js) -->
<div id="auth"><div class="box" id="authBox"></div></div>

<!-- Aplikasi utama: header, isi halaman (#view), footer, navigasi bawah -->
<div id="app">
  <header class="top">
    <span class="flex"><svg class="lg"><use href="#fl"/></svg><b id="hd">TaqwaLife</b></span>
    <span class="flex">
      <button class="icb" onclick="openAbout()" aria-label="Tentang dan informasi aplikasi" title="Tentang" id="ab"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="7.8" r=".6" fill="currentColor"/></svg></button>
      <button class="icb" onclick="openThemes()" aria-label="Pilih tema" title="Tema" id="dk"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 100 18c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.3-.5-.8-.5-1.2 0-1.1.9-2 2-2h2.3A3.7 3.7 0 0022 11 9 9 0 0012 3z"/><circle cx="7.5" cy="11" r="1.1" fill="currentColor"/><circle cx="10" cy="7" r="1.1" fill="currentColor"/><circle cx="15" cy="7" r="1.1" fill="currentColor"/></svg></button>
      <button class="icb" onclick="go('acc')" aria-label="Akun" title="Akun" id="ak"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c.8-3.7 3.8-5.5 7.5-5.5s6.7 1.8 7.5 5.5"/></svg></button>
    </span>
  </header>
  <main id="view"></main>
  <footer class="ft">Crafted with <span>♥</span> by <b>Kurniapedia</b> 2026</footer>
  <nav><div id="nav"></div></nav>
</div>
