<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<style>
:root{--bg:#F6F5F1;--ink:#0B0B0B;--card:#fff;--mut:#6B6658;--line:#E6E1D3;--gold:#B8912F;--gold2:#E3C46D;--gg:linear-gradient(135deg,#8E6B14,#E3C46D 50%,#B8912F);--bad:#B4413A;--rg:#E3C46D;--rt:rgba(212,175,55,.2);--f1:#F6E08C;--f2:#E3C46D;--f3:#A87B1E}
body.dark{--bg:#0A0A0A;--ink:#F4EFE0;--card:#151412;--mut:#A39B82;--line:#2B2718;--gold:#D4AF37}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;width:100%;outline:none}
input:focus,textarea:focus,button:focus-visible{border-color:var(--gold);outline:2px solid var(--gold2);outline-offset:1px}
h1,h2,h3,.sf{font-family:'Sora',sans-serif;font-weight:700;letter-spacing:-.015em}
.lt{font-weight:300}
h1,h2,h3,b,.tas,.code{font-variant-numeric:tabular-nums}
.ar{font-family:'Amiri',serif}
#splash{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 38%,#1d1708,#000 72%);color:#fff;transition:opacity .6s,visibility .6s}
#splash.hide{opacity:0;visibility:hidden}
#splash svg{animation:pop 1.2s cubic-bezier(.2,.9,.3,1.2) both}
#splash h1{font-size:38px;font-weight:800;letter-spacing:-.02em;margin-top:14px;background:var(--gg);-webkit-background-clip:text;background-clip:text;color:transparent}
#splash p{color:#cdbb8a;margin-top:2px;font-size:13px;letter-spacing:.4px}
@keyframes pop{from{transform:scale(.5) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
#auth{min-height:100%;display:none;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 0,#241c08,#000 65%)}
.box{background:#121110;color:#F4EFE0;border:1px solid rgba(212,175,55,.45);border-radius:26px 26px 26px 6px;padding:28px 24px;width:100%;max-width:390px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.box h2{font-size:24px}.box p{color:#A39B82;margin:2px 0 14px;font-size:14px}
.box input{background:#0A0A0A;border-color:#2B2718;color:#F4EFE0;margin-top:10px}
.tabs{display:flex;background:#0A0A0A;border-radius:12px;padding:4px;margin-bottom:6px}
.tabs button{flex:1;padding:9px;border-radius:9px;font-weight:700;font-size:13px;color:#A39B82}
.tabs button.on{background:var(--gg);color:#111}
.btn{background:var(--gg);color:#111;font-weight:800;border-radius:14px;padding:13px 18px;width:100%;margin-top:16px}
.btn.o{background:transparent;color:var(--gold);border:1.5px solid var(--gold)}
.btn.sm{width:auto;margin:0;padding:9px 14px;font-size:13px;border-radius:10px}
.lnk{color:var(--gold2);font-weight:600;font-size:13px;margin-top:12px;display:block;text-align:center;width:100%}
.warn{background:#2a2108;border:1px solid #6b5416;color:#E3C46D;border-radius:12px;padding:10px 12px;font-size:12px;margin-bottom:10px}
#app{display:none;max-width:620px;margin:0 auto;min-height:100%;padding-bottom:92px}
header.top{padding:calc(16px + env(safe-area-inset-top)) 20px 6px;display:flex;justify-content:space-between;align-items:center}
header.top b{font-size:19px;font-weight:700;letter-spacing:-.01em;font-family:'Sora',sans-serif}
.hero{margin:6px 16px 14px;border-radius:28px 28px 28px 8px;padding:22px;background:linear-gradient(145deg,#000,#1c1608);color:#F4EFE0;border:1px solid rgba(212,175,55,.5);display:flex;gap:16px;align-items:center;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-44px;top:-44px;width:150px;height:150px;border-radius:50%;border:22px solid rgba(212,175,55,.1)}
.hero small{color:var(--gold2);font-weight:600}
.hero h2{font-size:22px;line-height:1.2;margin:2px 0 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid rgba(212,175,55,.4);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600}
.sec{margin:0 16px 14px}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.card h3{font-size:16px;margin-bottom:8px}
.h{font-family:'Sora',sans-serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--gold);margin:18px 4px 8px}
.pt{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center}
.pt div{padding:8px 2px;border-radius:12px;background:var(--bg);font-size:12px;color:var(--mut)}
.pt div b{display:block;font-size:14px;color:var(--ink)}
.pt .nx{background:var(--gg)}.pt .nx,.pt .nx b{color:#111}
.quote{background:#0B0B0B;color:#F4EFE0;border:1px solid rgba(212,175,55,.45)}
.quote p{font-family:'Sora',sans-serif;font-size:16px;line-height:1.55;font-weight:500}.quote small{color:var(--gold2);font-weight:700}
.row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:last-child{border:0}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;transition:.15s;color:#111;font-size:14px;font-weight:800}
.row.on .ck{background:var(--gg);border-color:var(--gold)}
.row.on span.t{color:var(--mut)}
.row .t{flex:1;font-weight:600}.row small{color:var(--mut);font-weight:500;display:block;font-size:12px}
.pts{font-size:12px;color:var(--gold);font-weight:800}
.bar{height:8px;background:var(--bg);border-radius:9px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--gg);border-radius:9px;transition:width .4s}
.flex{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}
.icb{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);font-weight:800;font-size:17px;color:var(--gold)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav div{display:flex;width:100%;max-width:620px}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mut);padding:6px 0;border-radius:12px}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--gold)}
.pills{display:flex;gap:6px;overflow-x:auto;margin:0 16px 12px;padding-bottom:2px}
.pills button{padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:13px;white-space:nowrap}
.pills button.on{background:var(--gg);color:#111;border-color:transparent}
.bars{display:flex;gap:8px;align-items:flex-end;height:130px;margin-top:8px}
.bars div{flex:1;text-align:center;font-size:11px;color:var(--mut);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{display:block;background:var(--gg);border-radius:8px 8px 3px 3px;min-height:4px;margin-bottom:4px}
.tas{width:210px;height:210px;border-radius:50%;margin:10px auto;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#2a2210,#000);color:var(--gold2);font-size:46px;font-family:'Sora',sans-serif;font-weight:700;box-shadow:0 14px 40px rgba(0,0,0,.35),inset 0 0 0 6px rgba(212,175,55,.5);user-select:none}
.tas:active{transform:scale(.96)}
.note{border-left:3px solid var(--gold);padding:4px 0 4px 12px;margin:10px 0}
.note small{color:var(--mut)}
.del{color:var(--bad);font-size:12px;font-weight:700}
.bdg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.bdg div{padding:10px 2px;border-radius:14px;background:var(--bg);font-size:11px;line-height:1.2;opacity:.35;filter:grayscale(1)}
.bdg div.on{opacity:1;filter:none;border:1px solid var(--gold)}
.bdg span{display:block;font-size:24px}
.doa .ar{font-size:25px;line-height:1.9;text-align:right;direction:rtl;color:var(--gold)}
label.l{display:block;font-weight:600;font-size:13px;margin:10px 0 4px}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:var(--gold);color:#111;padding:10px 18px;border-radius:99px;font-weight:700;font-size:13px;opacity:0;transition:.3s;z-index:150;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.lg{width:30px;height:30px;flex:none}
.lb{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.lb:last-child{border:0}
.lb .rk{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--bg);color:var(--gold);flex:none}
.lb.me .rk,.lb:first-child .rk{background:var(--gg);color:#111}
.code{font-family:'Sora',sans-serif;font-size:28px;letter-spacing:6px;color:var(--gold);line-height:1.2}
.box>svg{display:block;margin-bottom:6px}
.cg{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:10px}
.cl{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);font-size:11px;font-weight:700;color:var(--mut);background:none}
.cl.on{background:var(--gg);color:#111;border-color:transparent}
.cl.td{border-color:var(--gold);color:var(--gold)}
.cl.on.td{color:#111}
.cl:disabled{opacity:.35;cursor:default}
.tm{color:var(--gold);font-weight:800;font-size:12px;margin-right:8px;font-family:Sora,sans-serif}
.st{font-size:28px;line-height:1;color:var(--line);background:none}
.st.on{color:var(--gold)}
.ft{text-align:center;font-size:11px;color:var(--mut);padding:10px 0 4px}
.ft span,.ft b{color:var(--gold)}
.ft b{font-weight:600}
.soc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.soc a{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:14px;text-decoration:none;color:var(--ink);font-weight:600;font-size:13px;transition:.2s}
.soc a:hover{border-color:var(--gold);color:var(--gold)}
.soc i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--gold);color:var(--gold);font-size:15px;flex:none}
details{border-bottom:1px solid var(--line);padding:11px 0}
details:last-child{border:0;padding-bottom:0}
summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:'+';color:var(--gold);font-weight:800}
details[open] summary::after{content:'−'}
details p,details li{color:var(--mut);font-size:13px;margin-top:6px}
details ol,details ul{padding-left:18px;margin-top:4px}
details b{color:var(--ink)}
.icb svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block;margin:auto}
.kv{display:flex;gap:10px;padding:5px 0;font-size:13px}
.kv small{color:var(--mut);width:78px;flex:none}

.thm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.thm button{border:1.5px solid var(--line);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}

#thsheet{position:fixed;inset:0;z-index:120;display:flex;align-items:flex-end;justify-content:center}
.sh-bg{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.sh{position:relative;width:100%;max-width:620px;background:var(--card);border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .25s ease;border-top:1px solid var(--line)}

  ${L.length?L.map(k=>{const st=k.d===tk?'Hari ini':k.d>tk?'Akan datang':'Selesai',q=k.q||[];return`<div class="card"><details ${kjO===k.id?'open':''} ontoggle="kjO=this.open?'${k.id}':(kjO==='${k.id}'?null:kjO)"><summary><div><b>${esc(k.t)}</b><br><small style="color:var(--mut);font-weight:500">${kjDate(k)}${k.w?' · '+k.w:''}</small></div><span class="chip pc" style="flex:none;align-self:flex-start">${st}</span></summary>

function saveK(){
  const t=$('#kjt').value.trim(),d=$('#kjd').value;
  if(!t)return toast('Isi tema kajian');if(!d)return toast('Pilih tanggal kajian');
  const o={t,d,w:$('#kjw').value,p:$('#kjp').value.trim(),s:$('#kjs').value.trim(),n:($('#kjn').value||'').trim().slice(0,1500)};
  if(kjE){Object.assign(kjFind(kjE),o);kjO=kjE;kjE=null}
  else{
    if(D.kj.length>=80)return toast('Maksimal 80 catatan kajian. Hapus yang lama dulu.');
    o.id='k'+Date.now().toString(36)+Math.floor(Math.random()*999);
    o.q=($('#kjq').value||'').split('\n').map(x=>x.trim().slice(0,150)).filter(Boolean).slice(0,10).map(x=>({x,a:0}));
    D.kj.push(o);kjO=o.id;
  }
  save();render();toast('Kajian tersimpan di daftar catatan kajian');setTimeout(()=>{const e=document.querySelector('details[open]');if(e&&e.scrollIntoView)e.scrollIntoView({behavior:'smooth',block:'start'})},60);
}
function editK(id){const k=kjFind(id);kjE=id;render();$('#kjt').value=k.t;$('#kjs').value=k.s||'';$('#kjd').value=k.d;$('#kjw').value=k.w||'';$('#kjp').value=k.p||'';$('#kjn').value=k.n||'';$('#kjt').scrollIntoView({block:'center'});$('#kjt').focus()}
function kjKeep(id){const t=$('#kn_'+id);if(t&&typeof t.value==='string'&&kjFind(id))kjFind(id).n=t.value.slice(0,1500)}
function addQ(id){kjKeep(id);const k=kjFind(id),v=($('#kq_'+id).value||'').trim().slice(0,150);if(!v)return toast('Tulis pertanyaannya dulu');k.q=k.q||[];if(k.q.length>=10)return toast('Maksimal 10 pertanyaan');k.q.push({x:v,a:0});kjO=id;save();render()}
function tgQ(id,i){kjKeep(id);const k=kjFind(id);k.q[i].a=k.q[i].a?0:1;kjO=id;save();render()}
function delQ(id,i){kjKeep(id);kjFind(id).q.splice(i,1);kjO=id;save();render()}
function saveN(id){kjKeep(id);save();toast('Catatan kajian tersimpan')}
function delK(id){if(!confirm('Hapus catatan kajian ini?'))return;D.kj=D.kj.filter(x=>x.id!==id);if(kjO===id)kjO=null;save();render()}
function kjHome(){

function addCI(){

function editCI(id){const c=D.ci.find(x=>x.id===id);if(!c)return;const n=prompt('Ubah nama ibadah:',c.n);if(n&&n.trim()){c.n=n.trim().slice(0,50);save();render()}}
function delCI(id){
  const c=D.ci.find(x=>x.id===id);if(!c||!confirm('Hapus "'+c.n+'" dari daftar? Riwayat sebelumnya tetap tersimpan.'))return;
  if(c.d>=key(new Date()))D.ci=D.ci.filter(x=>x.id!==id);else c.e=key(new Date());
  save();render();
}

function irem(){
  if(D.ir===0||!D.pt)return'';
  const n=new Date(),m=n.getHours()*60+n.getMinutes(),tm=s=>{const[h,mm]=s.split(':');return+h*60+ +mm},[sb,dz,as,mg,is]=D.pt.t.map(x=>tm(x[1])),L=[];
  if(n.getDay()===5)L.push(['🕌','Hari Jumat','Perbanyak sholawat, baca Surah Al-Kahfi, mandi, dan bersegera menuju masjid.']);
  if(m>=150&&m<sb)L.push(['✨','Sepertiga malam terakhir','Waktu yang mulia untuk tahajud, istighfar, dan berdoa.']);
  if(m>=sb&&m<sb+100)L.push(['☀️','Waktunya dzikir pagi','Bacalah dzikir pagi dan istighfar, lalu lanjutkan dengan tilawah.']);
  if(m>=sb+100&&m<dz-20)L.push(['🌤️','Waktu sholat Dhuha','Dua rakaat Dhuha dihitung sebagai sedekah bagi seluruh persendian tubuh (HR. Muslim).']);
  if(m>=as&&m<mg)L.push(['🌇','Waktunya dzikir petang','Jaga dzikir petang sebelum Maghrib tiba.']);
  if(m>=is+60)L.push(['🌙','Persiapan tidur','Berwudhu, baca Ayat Kursi dan tiga Qul, lalu doa sebelum tidur.']);
  if(!L.length)return'';
  return`<div class="card"><h3>Pengingat hari ini</h3>${L.slice(0,3).map(x=>`<div class="flex" style="align-items:flex-start;padding:6px 0"><span style="font-size:20px;line-height:1.3">${x[0]}</span><div><b>${x[1]}</b><br><small style="color:var(--mut)">${x[2]}</small></div></div>`).join('')}</div>`;
}

/* ===== PUSH & PASANG APLIKASI ===== */
async function togglePush(){
  if(D.push){D.push=0;save();if(db&&uid!=='local')db.collection('users').doc(uid).set({token:null},{merge:true}).catch(()=>{});return render()}
  if(!msg||uid==='local')return toast('Push butuh login Firebase dan browser yang mendukung');
  if(VAPID==='ISI_VAPID_KEY')return toast('Isi VAPID key di bagian konfigurasi dulu');
  try{
    if(await Notification.requestPermission()!=='granted')return toast('Izin notifikasi ditolak');
    const reg=await navigator.serviceWorker.ready,token=await msg.getToken({vapidKey:VAPID,serviceWorkerRegistration:reg});
    await db.collection('users').doc(uid).set({token},{merge:true});D.push=1;D.notif=1;save();render();toast('Push aktif');
  }catch(e){toast('Gagal mengaktifkan push')}
}
async function pasang(){if(!inst)return toast('Buka menu browser lalu pilih Tambahkan ke layar utama (iPhone: Bagikan, lalu Tambah ke Layar Utama).');inst.prompt();await inst.userChoice;inst=null;render()}
let instd=false;
function updIns(){const b=$('#ins');if(b)b.style.display=(matchMedia('(display-mode: standalone)').matches||navigator.standalone||instd)?'none':''}
addEventListener('appinstalled',()=>{instd=true;updIns()});
updIns();

boot();
</script>
